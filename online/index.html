</head>
<body>
  <!-- Shapes used everywhere: the chip numerals and the interface icons -->
  <svg class="tk-defs" aria-hidden="true" focusable="false">
    <symbol id="tk-n0" viewBox="0 0 40 50"><g fill="none" stroke="#161513" stroke-width="5.4"><ellipse cx="20" cy="25" rx="11" ry="16.5"/><path d="M12.5 37.5 L27.5 12.5"/></g></symbol>
    <symbol id="tk-n1" viewBox="0 0 40 50"><path d="M10.5 15.5 L22 7.5 V42.5 M10 42.5 H33" fill="none" stroke="#161513" stroke-width="5.4" stroke-linejoin="miter"/></symbol>
    <symbol id="tk-i-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></g></symbol>
    <symbol id="tk-i-hand" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-.5a6 6 0 0 1-4.7-2.3L4.6 16a1.6 1.6 0 0 1 2.4-2.1L9 15.5"/></g></symbol>
    <symbol id="tk-i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="tk-i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="tk-i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="tk-i-help" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8 1c0 1.7-2.4 2.2-2.4 3.7"/><path d="M12 17.2h.01"/></g></symbol>
    <symbol id="tk-i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="tk-i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="tk-i-play" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></g></symbol>
    <symbol id="tk-i-phone" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></g></symbol>
    <symbol id="tk-i-share" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8L12 3.5 16.5 8"/><path d="M5 12v7.5h14V12"/></g></symbol>
    <symbol id="tk-i-replay" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4.5h4.5"/></g></symbol>
    <symbol id="tk-i-computer" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 16h6"/><circle cx="9" cy="12.5" r="1.2"/><circle cx="15" cy="12.5" r="1.2"/></g></symbol>
    <symbol id="tk-i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="tk-i-globe" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.4 2.5 3.6 5.5 3.6 9s-1.2 6.5-3.6 9c-2.4-2.5-3.6-5.5-3.6-9s1.2-6.5 3.6-9z"/></g></symbol>
    <symbol id="tk-i-cup" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M16 10h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M8 3.5c-.6.8-.6 1.7 0 2.5M12 3.5c-.6.8-.6 1.7 0 2.5"/></g></symbol>

  <!-- Every word on the page comes from the string tables in js/strings: data-i18n is an element's
       text, data-i18n-label its aria-label, data-i18n-alt its alt text. data-fit marks one-line
       display text that shrinks to fit, down to the size given in px. -->
  <main id="app">

    <!-- Home -->
    <section id="screen-home" class="screen screen-lime" aria-labelledby="home-title" hidden>
      <div class="home">
        <div class="home-hero">
          <img class="home-logo" src="tikitala-dot-com.svg" alt="TIKITALA" width="216" height="167">
          <h1 id="home-title" class="home-tagline" tabindex="-1" data-i18n="home.tagline" data-fit="28"></h1>
          <p class="home-sub" data-i18n="home.sub"></p>
          <div class="home-chips" aria-hidden="true"></div>
        </div>
        <div class="home-actions">
          <button type="button" class="btn-big btn-primary" id="btn-computer">
            <svg class="btn-icon" aria-hidden="true"><use href="#tk-i-computer"/></svg>
            <span class="btn-text">
              <span class="btn-label" data-i18n="home.computer" data-fit="20"></span>
              <span class="btn-sub" id="computer-sub"></span>
            </span>
            <svg class="btn-chevron" aria-hidden="true"><use href="#tk-i-chevron"/></svg>
          </button>
          <button type="button" class="btn-plain" id="btn-computer-new" data-i18n="home.computer.new" hidden></button>
          <button type="button" class="btn-big btn-secondary-big" id="btn-play">
            <svg class="btn-icon" aria-hidden="true"><use href="#tk-i-phone"/></svg>
            <span class="btn-text">
              <span class="btn-label" data-i18n="home.pass" data-fit="20"></span>
              <span class="btn-sub" id="play-sub"></span>
            </span>
            <svg class="btn-chevron" aria-hidden="true"><use href="#tk-i-chevron"/></svg>
          </button>
          <button type="button" class="btn-plain" id="btn-new" data-i18n="home.pass.new" hidden></button>
          <a class="text-link" href="#learn">
            <svg aria-hidden="true"><use href="#tk-i-play"/></svg>
            <span data-i18n="home.learn"></span>
          </a>
          <footer class="home-footer">
            <span data-i18n="home.better"></span>
            <a href="https://tikitala.com" data-i18n="home.getChips"></a>
            <span class="lang-pick">
              <svg aria-hidden="true"><use href="#tk-i-globe"/></svg>
              <span class="lang-name" id="lang-name" aria-hidden="true"></span>
              <select id="lang" data-i18n-label="language"></select>
            </span>
          </footer>
        </div>
      </div>
    </section>

    <!-- Choosing a computer level -->
    <section id="screen-levels" class="screen screen-lime" aria-labelledby="levels-title" hidden>
      <div class="levels">
        <header class="levels-head">
          <a class="icon-btn" href="#" data-i18n-label="nav.back">
            <svg aria-hidden="true"><use href="#tk-i-back"/></svg>
          </a>
          <h1 id="levels-title" tabindex="-1" data-i18n="levels.title" data-fit="24"></h1>
        </header>
        <p class="levels-sub" data-i18n="levels.sub"></p>
        <div class="level-list">
          <button type="button" class="level" data-level="friendly">
            <span class="level-text">
              <span class="level-name"><span data-i18n="level.friendly.name"></span> <span class="level-last" data-i18n="levels.last" hidden></span></span>
              <span class="level-about" data-i18n="level.friendly.about"></span>
            </span>
            <svg class="btn-chevron" aria-hidden="true"><use href="#tk-i-chevron"/></svg>
          </button>
          <button type="button" class="level" data-level="clever">
            <span class="level-text">
              <span class="level-name"><span data-i18n="level.clever.name"></span> <span class="level-last" data-i18n="levels.last" hidden></span></span>
              <span class="level-about" data-i18n="level.clever.about"></span>
            </span>
            <svg class="btn-chevron" aria-hidden="true"><use href="#tk-i-chevron"/></svg>
          </button>
          <button type="button" class="level" data-level="ruthless">
            <span class="level-text">
              <span class="level-name"><span data-i18n="level.ruthless.name"></span> <span class="level-last" data-i18n="levels.last" hidden></span></span>
              <span class="level-about" data-i18n="level.ruthless.about"></span>
            </span>
            <svg class="btn-chevron" aria-hidden="true"><use href="#tk-i-chevron"/></svg>
          </button>
        </div>
      </div>
    </section>

    <!-- The game, and the lessons (which use the same table) -->
    <section id="screen-game" class="screen screen-ink" data-i18n-label="game" hidden>
      <div class="game">
        <header class="game-head">
          <div class="head-play">
            <a class="icon-btn" href="#" data-i18n-label="nav.menu">
              <svg aria-hidden="true"><use href="#tk-i-menu"/></svg>
            </a>
            <div class="wordmark">
              <span class="wordmark-name">TIKITALA</span>
              <span class="wordmark-mode" id="mode-label"></span>
            </div>
            <a class="icon-btn" href="#learn" data-i18n-label="nav.help">
              <svg aria-hidden="true"><use href="#tk-i-help"/></svg>
            </a>
          </div>
          <div class="head-lesson">
            <div class="lesson-progress">
              <span class="lesson-count" id="lesson-count"></span>
              <span class="lesson-bars" id="lesson-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            </div>
            <a class="skip-link" href="#" id="lesson-skip" data-i18n="lesson.skip"></a>
          </div>
        </header>

        <section class="panel-other" data-i18n-label="panel.other">
          <div class="tile tile-mini" id="other-tile"></div>
          <div class="panel-name">
            <span class="name" id="other-name" data-fit="18"></span>
            <span class="sub" id="other-stash"></span>
          </div>
          <div class="score">
            <span class="pips" id="other-pips"></span>
            <span class="score-text" id="other-score"></span>
          </div>
        </section>

        <section class="lesson-card" aria-labelledby="lesson-title">
          <h1 id="lesson-title" tabindex="-1" data-fit="22"></h1>
          <p id="lesson-body"></p>
          <div class="lesson-score">
            <span data-i18n="lesson.onTop"></span>
            <span><span data-i18n="lesson.you"></span> <span class="pips" id="lesson-pips-0"></span></span>
            <span><span data-i18n="lesson.them"></span> <span class="pips" id="lesson-pips-1"></span></span>
          </div>
        </section>

        <div class="table" id="table">
          <div class="board-outer" id="board-outer">
            <div class="board" id="board"></div>
          </div>
        </div>

        <section class="panel-me" data-i18n-label="panel.me">
          <div class="turn-text">
            <h2 class="headline" id="headline" data-fit="26"></h2>
            <p class="instruction" id="instruction"></p>
          </div>
          <div class="row row-pick" id="row-pick">
            <button type="button" class="tray" id="btn-stash">
              <span class="tile tile-hand" id="stash-tile"></span>
              <span class="tray-text">
                <span class="name" data-i18n="stash" data-fit="18"></span>
                <span class="sub" id="stash-sub"></span>
              </span>
            </button>
            <div class="score score-me">
              <span class="name" id="me-name" data-fit="18"></span>
              <span class="pips" id="me-pips"></span>
              <span class="score-text" id="me-score"></span>
            </div>
          </div>
          <div class="row row-place" id="row-place" hidden>
            <button type="button" class="tray tray-hand" id="btn-tray">
              <span class="tile tile-hand" id="hand-tile"></span>
              <span class="tray-text">
                <span class="name" data-i18n="hand" data-fit="18"></span>
                <span class="sub" id="hand-sub"></span>
              </span>
            </button>
            <button type="button" class="btn-putback" id="btn-putback" data-i18n="hand.putBack"></button>
            <div class="no-takebacks" id="no-takebacks" role="note">
              <svg aria-hidden="true"><use href="#tk-i-lock"/></svg>
              <span data-i18n="hand.noTakebacks"></span>
            </div>
          </div>
          <div class="row row-next" id="row-next" hidden>
            <button type="button" class="btn-big btn-lime" id="btn-next">
              <span class="btn-text"><span class="btn-label" id="next-label" data-fit="20"></span></span>
              <svg class="btn-chevron" aria-hidden="true"><use href="#tk-i-chevron"/></svg>
            </button>
          </div>
        </section>
      </div>
    </section>

    <!-- Game over, and the big reveal -->
    <section id="screen-over" class="screen screen-lime" aria-labelledby="over-title" hidden>
      <div class="over">
        <header class="over-head">
          <a class="icon-btn" href="#" data-i18n-label="nav.back">
            <svg aria-hidden="true"><use href="#tk-i-close"/></svg>
          </a>
          <span class="over-tag" id="over-tag"></span>
          <span class="icon-spacer"></span>
        </header>
        <div class="over-hero">
          <div>
            <h1 id="over-title" tabindex="-1" data-fit="28"></h1>
            <p id="over-sub"></p>
          </div>
          <div class="over-chip" id="over-chip" aria-hidden="true"></div>
        </div>
        <section class="reveal" aria-labelledby="reveal-title">
          <div class="reveal-head">
            <h2 id="reveal-title" data-i18n="reveal.title"></h2>
            <span data-i18n="reveal.topInFront"></span>
          </div>
          <div class="reveal-grid" id="reveal-grid"></div>
          <p class="reveal-text" id="reveal-text"></p>
        </section>
        <div class="over-actions">
          <button type="button" class="btn-wide btn-primary" id="btn-rematch">
            <svg aria-hidden="true"><use href="#tk-i-replay"/></svg>
            <span data-i18n="over.rematch"></span>
          </button>
          <button type="button" class="btn-wide btn-secondary" id="btn-share">
            <svg aria-hidden="true"><use href="#tk-i-share"/></svg>
            <span data-i18n="over.share"></span>
          </button>
        </div>
        <a class="promo" href="https://tikitala.com">
          <img src="images/chips-on-table.jpg" data-i18n-alt="promo.alt" alt="" width="64" height="64">
          <span class="promo-text">
            <span class="promo-title" data-i18n="promo.title"></span>
            <span class="promo-link" data-i18n="promo.link"></span>
          </span>
        </a>
        <a class="kofi" href="https://ko-fi.com/H4R229AAN0" target="_blank" rel="noopener">
          <svg aria-hidden="true"><use href="#tk-i-cup"/></svg>
          <span data-i18n="kofi"></span>
        </a>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="sr-only" id="live" aria-live="polite"></div>

  <noscript>
    <p class="noscript">TIKITALA Online needs JavaScript to play. You can still <a href="https://tikitala.com">read the rules and get the chips at tikitala.com</a>.</p>
  </noscript>
</body>
</html>
